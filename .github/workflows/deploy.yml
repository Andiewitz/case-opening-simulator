name: Deploy

# Manual only: a deploy needs a reviewed plan and an approval, and the workflow
# never runs from a fork.
on:
  workflow_dispatch:
    inputs:
      deploy_infrastructure:
        description: "Run terraform apply after the build (otherwise only the frontend is deployed)"
        type: boolean
        default: false
      ref:
        description: "Git ref to deploy (defaults to the selected branch)"
        type: string
        required: false
  # TEMPORARY: lets this one commit deploy itself without a manual click.
  # Removed in the next commit.
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build frontend and Lambda bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check:crates
      - run: npm run check:prices
      - run: npm run build
      - run: npm run build:backend

      - name: Package frontend
        run: (cd dist && zip -qr ../frontend.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: deploy-${{ github.sha }}
          if-no-files-found: error
          retention-days: 3
          path: |
            frontend.zip
            backend/dist

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    # Requires a reviewer in the repository's "production" environment.
    environment:
      name: production
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS role; no long-lived keys
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
      AMPLIFY_BRANCH: ${{ vars.AMPLIFY_BRANCH }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          name: deploy-${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: Install
        run: npm ci

      - name: Bake + build backend for terraform
        run: npm run build:backend

      # The backend zip is read by terraform's archive_file data source, so the
      # bundles must exist before init/plan/apply.
      - name: Terraform plan
        working-directory: terraform
        run: |
          # The bucket and key are pinned in backend.tf, so init needs no
          # flags and a mistyped variable cannot point CI at a different state.
          terraform init -input=false -lock-timeout=60s
          terraform plan -input=false -lock-timeout=60s -out=tfplan

      - name: Terraform apply
        if: inputs.deploy_infrastructure || github.event_name == 'push'
        working-directory: terraform
        run: terraform apply -input=false -lock-timeout=60s -auto-approve tfplan

      - name: Upload Amplify deployment
        if: env.AMPLIFY_APP_ID != ''
        run: |
          set -euo pipefail
          DEPLOYMENT=$(aws amplify create-deployment \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH")
          ZIP_URL=$(echo "$DEPLOYMENT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).zipUploadUrl))")
          JOB_ID=$(echo "$DEPLOYMENT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).jobId))")
          curl -sf -X PUT -H "Content-Type: application/zip" --upload-file frontend.zip "$ZIP_URL"
          aws amplify start-deployment --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" --job-id "$JOB_ID"

          # Wait for the job to finish: starting a deployment returns immediately,
          # so smoke-checking now would test the previous build and pass.
          for attempt in $(seq 1 30); do
            STATUS=$(aws amplify get-job --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" --query 'job.summary.status' --output text)
            echo "amplify job: $STATUS"
            case "$STATUS" in
              SUCCEED) break ;;
              FAILED|CANCELLED) echo "Amplify job $STATUS" >&2; exit 1 ;;
            esac
            if [ "$attempt" -eq 30 ]; then echo "Amplify job did not finish in 5 minutes" >&2; exit 1; fi
            sleep 10
          done

      # CI2 smoke checks: the two failures that are otherwise invisible —
      # a broken SPA rewrite and a missing crates snapshot in the Lambda zip.
      - name: Smoke check
        run: |
          set -euo pipefail
          curl -sf -o /dev/null -w "frontend %{http_code}\n" "$FRONTEND_URL/"
          curl -sf -o /dev/null -w "spa route %{http_code}\n" "$FRONTEND_URL/inventory"
          curl -sf -D /tmp/crates.headers -o /dev/null "$API_BASE_URL/crates"
          grep -qi "content-encoding: gzip" /tmp/crates.headers
          curl -sf -o /dev/null "$API_BASE_URL/config"

          # A clean checkout has no .env.local, so the values in
          # .env.production are all the build gets. If they are missing the app
          # quietly calls the Amplify origin and cannot talk to Cognito, which
          # looks fine to a status-code check. Assert them inside the bundle.
          curl -sf "$FRONTEND_URL/?deploy=$GITHUB_SHA" -o /tmp/index.html
          ASSET=$(grep -o 'assets/index-[^"]*\.js' /tmp/index.html | head -1 || true)
          test -n "$ASSET"
          curl -sf "$FRONTEND_URL/$ASSET" -o /tmp/app.js
          grep -qF "$API_BASE_URL" /tmp/app.js
          grep -qF "$COGNITO_CLIENT_ID" /tmp/app.js
          echo "bundle $ASSET knows the API and the user pool"
          echo "smoke checks passed"
